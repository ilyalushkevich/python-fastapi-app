[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests/unit",
    "tests/allure"
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.:DeprecationWarning",
]
